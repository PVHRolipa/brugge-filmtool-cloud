<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta id="themeColor" name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Brugge Film">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>Brugge Film Tool</title>
<style>
:root {
  color-scheme: dark;
  --bg: #0d0d11;
  --bg-soft: #15161b;
  --panel: rgba(20, 20, 26, 0.94);
  --panel-2: rgba(29, 29, 37, 0.96);
  --line: rgba(236, 211, 148, 0.16);
  --line-strong: rgba(236, 211, 148, 0.28);
  --ink: #f6f1e4;
  --muted: #b7b1a3;
  --gold: #e3bf73;
  --gold-soft: rgba(227, 191, 115, 0.12);
  --red: #a53030;
  --red-soft: rgba(165, 48, 48, 0.16);
  --teal: #2f7f84;
  --teal-soft: rgba(47, 127, 132, 0.18);
  --shadow: 0 18px 60px rgba(0, 0, 0, 0.38);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
  background:
    radial-gradient(circle at top right, rgba(165,48,48,.18), transparent 30%),
    radial-gradient(circle at top left, rgba(227,191,115,.08), transparent 28%),
    linear-gradient(180deg, #0b0b10 0%, #13141a 100%);
  color:var(--ink);
  min-height:100vh;
}
body::before{
  content:"";
  position:fixed; inset:0; pointer-events:none; opacity:.08;
  background:
    repeating-linear-gradient(90deg, transparent 0 30px, rgba(255,255,255,.5) 30px 31px, transparent 31px 62px),
    linear-gradient(180deg, transparent, rgba(255,255,255,.08), transparent);
  mix-blend-mode:soft-light;
}
header{
  padding-top:env(safe-area-inset-top);
  position:sticky; top:0; z-index:5;
  backdrop-filter: blur(16px);
  background:linear-gradient(180deg, rgba(8,8,11,.96), rgba(14,14,18,.93));
  border-bottom:1px solid var(--line);
}
.hero{
  max-width:1400px; margin:auto; padding:28px 28px 18px;
}
.hero-card{
  display:flex; align-items:flex-end; justify-content:space-between; gap:18px;
  background:
    linear-gradient(135deg, rgba(227,191,115,.1), transparent 34%),
    linear-gradient(180deg, rgba(255,255,255,.02), rgba(255,255,255,.01));
  border:1px solid var(--line-strong);
  border-radius:22px;
  padding:26px 24px;
  box-shadow:var(--shadow);
  position:relative;
  overflow:hidden;
}
.hero-card::before,
.hero-card::after{
  content:""; position:absolute; top:0; bottom:0; width:15px;
  background:
    radial-gradient(circle, rgba(8,8,11,.98) 0 4px, transparent 4.4px) center 10px / 100% 28px repeat-y;
  opacity:.95;
}
.hero-card::before{left:0}
.hero-card::after{right:0}
.title-wrap{padding:0 16px 0 18px}
.kicker{
  display:inline-block; font-size:12px; letter-spacing:.22em; text-transform:uppercase;
  color:var(--gold); margin-bottom:10px;
}
.title h1{margin:0 0 8px; font-size:34px; line-height:1.05}
.title p{margin:0; color:var(--muted); max-width:760px}
.actions{display:flex; align-items:center; gap:10px; padding:0 18px 0 16px}
button{
  border:1px solid var(--line-strong);
  background:linear-gradient(180deg, #1b1c23, #15161c);
  color:var(--ink);
  border-radius:999px;
  padding:11px 16px;
  font-size:14px;
  cursor:pointer;
  transition:transform .12s ease, border-color .12s ease, background .12s ease;
}
button:hover{transform:translateY(-1px); border-color:rgba(227,191,115,.45)}
button.primary{
  background:linear-gradient(180deg, #b64545, #8f2c2c);
  border-color:#bf6767;
  box-shadow:0 8px 24px rgba(165,48,48,.26);
}
button:disabled{opacity:.58;cursor:wait;transform:none}
.controls{
  max-width:1400px; margin:14px auto 0; padding:0 28px 22px;
  display:grid; grid-template-columns:minmax(240px,2fr) repeat(3,minmax(150px,1fr)); gap:12px;
}
input,select{
  width:100%;
  padding:12px 14px;
  border:1px solid rgba(227,191,115,.18);
  border-radius:14px;
  background:rgba(23,24,30,.96);
  color:var(--ink);
  font-size:14px;
  outline:none;
}
input::placeholder{color:#928b7d}
input:focus,select:focus{border-color:rgba(227,191,115,.48); box-shadow:0 0 0 3px rgba(227,191,115,.12)}
main{max-width:1400px; margin:22px auto; padding:0 28px calc(56px + env(safe-area-inset-bottom))}
.stats{display:flex; gap:12px; flex-wrap:wrap; margin-bottom:14px}
.stat{
  background:linear-gradient(180deg, rgba(32,33,40,.98), rgba(22,23,29,.95));
  border:1px solid var(--line);
  border-radius:16px;
  padding:12px 15px;
  min-width:140px;
  box-shadow:var(--shadow);
}
.stat strong{display:block; font-size:24px; color:var(--gold); margin-bottom:2px}
.stat span{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em}
.status{color:var(--muted);font-size:13px;margin:0 0 16px;padding-left:2px}
.list{display:grid;gap:14px}
.event{
  background:linear-gradient(180deg, rgba(26,27,34,.96), rgba(18,18,24,.98));
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
  display:grid;
  grid-template-columns:150px minmax(220px,1.25fr) minmax(180px,.8fr) minmax(260px,2fr) auto;
  gap:0;
}
.date-block{
  background:
    linear-gradient(180deg, rgba(165,48,48,.2), rgba(165,48,48,.07)),
    linear-gradient(180deg, rgba(255,255,255,.02), transparent);
  border-right:1px solid var(--line);
  padding:18px 18px 18px 20px;
  position:relative;
}
.date-block::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:12px;
  background: radial-gradient(circle, rgba(13,13,17,1) 0 3.5px, transparent 3.9px) center 11px / 100% 27px repeat-y;
}
.date{font-weight:700;font-size:15px;line-height:1.35;padding-left:12px}
.time{font-size:13px;color:#f0d8d8;margin-top:6px;padding-left:12px}
.content,.venue-wrap,.desc-wrap,.open-wrap{padding:18px 18px}
.name{font-weight:780;font-size:19px;line-height:1.25;margin-bottom:8px}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.venue{font-size:14px;color:#ded5c3}
.desc{font-size:14px;line-height:1.5;color:#d1cabd;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.badge{
  display:inline-flex; align-items:center; gap:7px;
  font-size:12px; padding:6px 10px; border-radius:999px; border:1px solid transparent;
  text-transform:uppercase; letter-spacing:.05em; font-weight:650;
}
.badge::before{content:""; width:8px; height:8px; border-radius:50%; background:currentColor; opacity:.9}
.badge-film{background:var(--red-soft); color:#ffb0b0; border-color:rgba(165,48,48,.35)}
.badge-filmfestival{background:var(--gold-soft); color:#f4dca3; border-color:rgba(227,191,115,.3)}
.badge-audiovisuele-tentoonstelling{background:var(--teal-soft); color:#8fdce0; border-color:rgba(47,127,132,.3)}
.badge-filmgerelateerd{background:rgba(255,255,255,.07); color:#d6d0c5; border-color:rgba(255,255,255,.08)}
.badge-default{background:rgba(255,255,255,.07); color:#d6d0c5; border-color:rgba(255,255,255,.08)}
.open-wrap{display:flex;align-items:flex-start;justify-content:flex-end;white-space:nowrap}
.open-link{
  display:inline-flex; align-items:center; gap:8px;
  text-decoration:none; color:var(--gold);
  border:1px solid rgba(227,191,115,.24);
  border-radius:999px; padding:10px 13px;
  background:rgba(227,191,115,.08);
}
.open-link:hover{background:rgba(227,191,115,.12)}
.empty{
  padding:46px 30px;background:linear-gradient(180deg, rgba(26,27,34,.96), rgba(18,18,24,.98));
  border:1px solid var(--line);border-radius:22px;text-align:center;color:var(--muted)
}
small.note{display:block;color:#938e82;margin-top:6px}

/* Theme variants — all retained; the user can switch at any time. */
body[data-theme="arthouse"]{
  --bg:#eee7d6; --bg-soft:#f5efe1; --panel:rgba(251,247,238,.96); --panel-2:rgba(244,238,225,.98);
  --line:rgba(33,39,52,.14); --line-strong:rgba(33,39,52,.25); --ink:#202532; --muted:#6f6d67;
  --gold:#8b632f; --gold-soft:rgba(139,99,47,.11); --red:#7d2530; --red-soft:rgba(125,37,48,.10);
  --teal:#486f72; --teal-soft:rgba(72,111,114,.11); --shadow:0 16px 42px rgba(64,52,35,.13); color-scheme:light;
  background:radial-gradient(circle at top right, rgba(125,37,48,.08), transparent 28%),linear-gradient(180deg,#f5efe1,#e8dfcc);
}
body[data-theme="arthouse"] header{background:rgba(245,239,225,.94)}
body[data-theme="arthouse"] .hero-card,body[data-theme="arthouse"] .stat,body[data-theme="arthouse"] .event,body[data-theme="arthouse"] .empty{background:rgba(252,248,239,.96)}
body[data-theme="arthouse"] input,body[data-theme="arthouse"] select,body[data-theme="arthouse"] button{background:#faf6ed;color:#202532}
body[data-theme="arthouse"] .venue,body[data-theme="arthouse"] .desc{color:#4d4c49}
body[data-theme="arthouse"] .time{color:#7d2530}
body[data-theme="arthouse"] .date-block{background:linear-gradient(180deg,rgba(125,37,48,.09),rgba(139,99,47,.05))}
body[data-theme="arthouse"] .date-block::before{background:radial-gradient(circle,#eee7d6 0 3.5px,transparent 3.9px) center 11px/100% 27px repeat-y}

body[data-theme="retro70"]{
  --bg:#241810; --bg-soft:#2e2017; --panel:rgba(58,37,24,.95); --panel-2:rgba(79,55,37,.97);
  --line:rgba(255,214,127,.26); --line-strong:rgba(255,214,127,.42); --ink:#fff4d2; --muted:#d8bb8b;
  --gold:#ffd67f; --gold-soft:rgba(255,214,127,.16); --red:#cf5b39; --red-soft:rgba(207,91,57,.18);
  --teal:#86b6c2; --teal-soft:rgba(134,182,194,.16); --shadow:0 22px 66px rgba(0,0,0,.42);
  background:
    linear-gradient(180deg, rgba(13,9,7,.72), rgba(34,22,15,.86)),
    radial-gradient(circle at 50% -10%, rgba(255,175,92,.16), transparent 28%),
    url('./web/retro-marquee.png') center top / cover fixed no-repeat,
    linear-gradient(180deg,#241810,#3a2619);
}
body[data-theme="retro70"] header{
  background:linear-gradient(180deg, rgba(32,20,13,.94), rgba(42,27,17,.92));
}
body[data-theme="retro70"] .hero-card{
  border-radius:14px;
  border:2px solid rgba(255,224,145,.38);
  background:
    linear-gradient(180deg, rgba(79,52,33,.94), rgba(54,35,24,.95)),
    linear-gradient(90deg, rgba(255,255,255,.06), rgba(255,255,255,0));
  box-shadow:0 0 0 1px rgba(255,224,145,.12), 0 18px 50px rgba(0,0,0,.45);
}
body[data-theme="retro70"] .hero-card::before,
body[data-theme="retro70"] .hero-card::after{
  background:
    radial-gradient(circle, rgba(255,228,154,.96) 0 3.4px, rgba(165,96,33,.75) 3.6px 5px, transparent 5.2px) center 11px / 100% 25px repeat-y;
  opacity:1;
}
body[data-theme="retro70"] .title h1{
  text-transform:uppercase;
  letter-spacing:.04em;
  text-shadow:0 2px 0 rgba(0,0,0,.28);
}
body[data-theme="retro70"] .title p{color:#f1d5a1}
body[data-theme="retro70"] .event,
body[data-theme="retro70"] .stat{
  border-radius:12px;
  background:linear-gradient(180deg, rgba(73,49,33,.96), rgba(48,33,23,.98));
}
body[data-theme="retro70"] .date-block{
  background:
    linear-gradient(180deg, rgba(255,213,126,.14), rgba(207,91,57,.12)),
    linear-gradient(180deg, rgba(255,255,255,.02), transparent);
}
body[data-theme="retro70"] .input,
body[data-theme="retro70"] input,
body[data-theme="retro70"] select{
  border-radius:6px;
  background:#3a291e;
  color:#fff0c6;
}
body[data-theme="retro70"] button,
body[data-theme="retro70"] .open-link{
  border-radius:6px;
}
body[data-theme="retro70"] .open-link{
  background:rgba(255,214,127,.12);
}
body[data-theme="retro70"] .name{color:#fff1c7}
body[data-theme="retro70"] .venue,
body[data-theme="retro70"] .desc{color:#edd8b0}

body[data-theme="genre"]{
  --bg:#050506; --bg-soft:#0a0a0d; --panel:rgba(12,12,15,.98); --panel-2:rgba(17,17,21,.98);
  --line:rgba(231,28,36,.22); --line-strong:rgba(231,28,36,.45); --ink:#f5f5f5; --muted:#96969e;
  --gold:#e7e7e7; --gold-soft:rgba(255,255,255,.08); --red:#e11c24; --red-soft:rgba(225,28,36,.18);
  --teal:#6f36b6; --teal-soft:rgba(111,54,182,.18); --shadow:0 18px 64px rgba(0,0,0,.7);
  background:radial-gradient(circle at 85% 0,rgba(225,28,36,.18),transparent 32%),linear-gradient(180deg,#030304,#0b0b0e);
}
body[data-theme="genre"] .kicker,body[data-theme="genre"] .stat strong,body[data-theme="genre"] .open-link{color:#ff3b42}
body[data-theme="genre"] .hero-card{border-color:rgba(225,28,36,.42);box-shadow:0 0 0 1px rgba(225,28,36,.1),0 20px 80px rgba(0,0,0,.72)}
body[data-theme="genre"] button.primary{background:linear-gradient(180deg,#ef2730,#9f0e14);border-color:#ff5258}


/* UiT in Brugge — closer to the public UiTkalender: clean white canvas, editorial cards. */
.uit-toolbar,.uit-poster{display:none}
body[data-theme="uitbrugge"]{
  --bg:#ffffff; --bg-soft:#ffffff; --panel:#ffffff; --panel-2:#ffffff;
  --line:#dedede; --line-strong:#c8c8c8; --ink:#171717; --muted:#696969;
  --gold:#171717; --gold-soft:#f4f4f4; --red:#ffd500; --red-soft:#fff4a7;
  --teal:#2f756c; --teal-soft:#e5f1ef; --shadow:none;
  color-scheme:light;
  background:#ffffff;
  color:#171717;
}
body[data-theme="uitbrugge"]::before{display:none}
body[data-theme="uitbrugge"] header{
  position:static;backdrop-filter:none;background:#fff;border-bottom:1px solid #e5e5e5;
}
body[data-theme="uitbrugge"] .hero{max-width:1320px;padding:34px 28px 18px}
body[data-theme="uitbrugge"] .hero-card{
  background:#fff;border:0;box-shadow:none;border-radius:0;padding:0;align-items:flex-start;
}
body[data-theme="uitbrugge"] .hero-card::before,
body[data-theme="uitbrugge"] .hero-card::after{display:none}
body[data-theme="uitbrugge"] .title-wrap{padding:0}
body[data-theme="uitbrugge"] .kicker{display:none}
body[data-theme="uitbrugge"] .title h1{
  font-size:46px;line-height:1;letter-spacing:-.045em;color:#111;margin:0 0 10px;text-transform:uppercase;font-weight:850
}
body[data-theme="uitbrugge"] .title p{font-size:16px;line-height:1.45;color:#5f5f5f;max-width:720px}
body[data-theme="uitbrugge"] .actions{padding:0;align-self:flex-start;gap:9px}
body[data-theme="uitbrugge"] button{
  border-radius:0;background:#fff;color:#171717;border:1px solid #bdbdbd;box-shadow:none;font-weight:700
}
body[data-theme="uitbrugge"] button.primary{
  background:#ffd500;color:#111;border-color:#ffd500;box-shadow:none
}
body[data-theme="uitbrugge"] .controls{
  max-width:1320px;margin:0 auto;padding:22px 28px 28px;background:#fff;
  grid-template-columns:minmax(320px,2.2fr) minmax(170px,.8fr) minmax(170px,.8fr) minmax(170px,.8fr);
  border-top:1px solid #eeeeee;
}
body[data-theme="uitbrugge"] input,
body[data-theme="uitbrugge"] select{
  border-radius:0;background:#fff;color:#171717;border:1px solid #bdbdbd;padding:13px 14px;
}
body[data-theme="uitbrugge"] input:focus,
body[data-theme="uitbrugge"] select:focus{border-color:#111;box-shadow:0 0 0 2px rgba(255,213,0,.35)}
body[data-theme="uitbrugge"] main{max-width:1320px;margin:0 auto;padding:30px 28px 70px;background:#fff}
body[data-theme="uitbrugge"] .stats{display:none}
body[data-theme="uitbrugge"] .status{margin:0 0 18px;color:#767676;font-size:12px}
body[data-theme="uitbrugge"] .uit-toolbar{
  display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;
  margin:0 0 30px;padding:0 0 18px;border-bottom:1px solid #d9d9d9;
}
body[data-theme="uitbrugge"] .uit-left{display:flex;flex-direction:column;gap:13px}
body[data-theme="uitbrugge"] .results-count{font-size:18px;font-weight:800;color:#111}
body[data-theme="uitbrugge"] .filter-chips{display:flex;gap:7px;flex-wrap:wrap}
body[data-theme="uitbrugge"] .filter-chip{
  min-height:36px;padding:7px 11px;border-radius:0;border:1px solid #bdbdbd;background:#fff;color:#171717;font-size:13px;font-weight:700;cursor:pointer
}
body[data-theme="uitbrugge"] .filter-chip.active{background:#ffd500;border-color:#ffd500;color:#111}
body[data-theme="uitbrugge"] .sort-wrap{display:flex;align-items:center;gap:8px;color:#676767;font-size:13px}
body[data-theme="uitbrugge"] .sort-select{width:auto;min-width:145px}
body[data-theme="uitbrugge"] .list{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:38px 26px;
}
body[data-theme="uitbrugge"] .event{
  display:flex;flex-direction:column;min-width:0;background:#fff;border:0;border-radius:0;
  overflow:visible;box-shadow:none;gap:0;padding-bottom:22px;border-bottom:1px solid #dadada;
}
body[data-theme="uitbrugge"] .uit-poster{
  display:flex;position:relative;aspect-ratio:1.38/1;min-height:0;padding:0;align-items:flex-end;
  background:#ededed;color:#fff;overflow:hidden;margin-bottom:15px;
}
body[data-theme="uitbrugge"] .uit-poster::before{display:none}
body[data-theme="uitbrugge"] .poster-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none;z-index:0}
body[data-theme="uitbrugge"] .uit-poster.has-image .poster-image{display:block}
body[data-theme="uitbrugge"] .uit-poster.has-image .poster-mark{display:none}
body[data-theme="uitbrugge"] .uit-poster.has-image::after{display:none}
body[data-theme="uitbrugge"] .poster-mark{
  position:relative;z-index:1;font-size:48px;font-weight:900;line-height:.9;letter-spacing:-.06em;
  max-width:80%;word-break:break-word;color:#171717;padding:20px
}
body[data-theme="uitbrugge"] .poster-badge{display:none}

  clip-path:polygon(
    21.66% 1.89%,21.02% 3.77%,0% 3.77%,0% 66.04%,13.38% 66.04%,14.01% 67.92%,
    14.01% 84.91%,14.65% 86.79%,14.65% 88.68%,16.56% 94.34%,17.20% 94.34%,17.83% 96.23%,
    94.90% 96.23%,95.54% 94.34%,96.18% 94.34%,97.45% 90.57%,97.45% 88.68%,98.09% 86.79%,
    98.09% 84.91%,98.73% 83.02%,98.73% 45.28%,98.09% 43.40%,98.09% 41.51%,96.18% 35.85%,
    95.54% 35.85%,94.90% 33.96%,94.27% 33.96%,93.63% 32.08%,84.08% 32.08%,83.44% 30.19%,
    83.44% 13.21%,80.89% 5.66%,80.25% 5.66%,79.62% 3.77%,68.15% 3.77%,67.52% 1.89%,
    66.24% 1.89%,65.61% 3.77%,62.42% 3.77%,61.78% 1.89%
  )
}
body[data-theme="uitbrugge"] .uit-date-banner::before,
body[data-theme="uitbrugge"] .uit-date-banner::after{display:none}
body[data-theme="uitbrugge"] .uit-date-weekday{
  font-size:15px;font-weight:800;line-height:1;text-align:right;text-transform:lowercase;padding-right:1px;align-self:start;margin-top:12px
}
body[data-theme="uitbrugge"] .uit-date-day{
  font-size:47px;font-weight:900;line-height:.88;letter-spacing:-.055em;text-align:center;font-variant-numeric:tabular-nums;align-self:center;margin-top:-1px
}
body[data-theme="uitbrugge"] .uit-date-month{
  font-size:15px;font-weight:800;line-height:1;text-transform:lowercase;align-self:end;margin-bottom:10px;padding-left:1px
}
body[data-theme="uitbrugge"] .uit-date-time{display:none}
body[data-theme="uitbrugge"] .date-block{display:flex;order:2;padding:0 0 9px;border:0;background:none;align-items:center}

  font-family:"Arial Narrow","Helvetica Neue Condensed","Avenir Next Condensed","Helvetica Neue",Arial,sans-serif;
  font-size:22px;
  font-weight:600;
  letter-spacing:.045em;
  line-height:1.15;
}

body[data-theme="arthouse"] .venue,
body[data-theme="arthouse"] .desc,
body[data-theme="arthouse"] .status{
  letter-spacing:.015em;
}

@media(max-width:900px){
  body[data-theme="arthouse"] .title h1{
    font-size:40px;
    letter-spacing:.10em;
    white-space:normal;
  }
}

</style>
</head>
<body>
<header>
  <div class="hero">
    <div class="hero-card">
      <div class="title-wrap title">
        <span class="kicker">Brugge op het scherm</span>
        <h1>Brugge Film Tool</h1>
        <p>Een cinematische bladerlaag boven UiTinVlaanderen voor Brugge — film, filmfestivals en aanverwante audiovisuele events in de komende 120 dagen.</p>
      </div>
      <div class="actions">
        <select id="theme" class="theme-select" aria-label="Kies skin">
          <option value="noir">Cinema Noir</option>
          <option value="arthouse">Arthouse</option>
          <option value="retro70">Retro 70s</option>
          <option value="genre">Genre Night</option>
          <option value="uitbrugge">UiT in Brugge</option>
          <option value="razorreel">Razor Reel</option>
        </select>
      </div>
    </div>
  </div>
  <div class="controls" id="filtersPanel">
    <div class="mobile-filter-head">
      <strong>Zoeken & filters</strong>
      <button id="closeFilters" type="button" aria-label="Sluit filters">Sluiten</button>
    </div>
    <input id="search" type="search" placeholder="Zoek titel, locatie of beschrijving…">
    <select id="category"><option value="">Alle categorieën</option></select>
    <select id="venue"><option value="">Alle locaties</option></select>
    <select id="period"><option value="all">Volledige periode</option><option value="14">Komende 14 dagen</option><option value="30">Komende 30 dagen</option><option value="60">Komende 60 dagen</option></select>
  </div>
</header>
<main>
  <div id="stats" class="stats"><div class="stat"><strong id="count">0</strong><span>zichtbaar</span></div></div>
  <p id="status" class="status">Gegevens laden…</p>
  <div class="uit-toolbar" id="uitToolbar">
    <div class="uit-left">
      <div class="results-count" id="resultsCount">0 resultaten gevonden</div>
      <div class="filter-chips" id="quickFilters"></div>
    </div>
    <div class="sort-wrap">
      <label for="sort">Sorteer op</label>
      <select id="sort" class="sort-select">
        <option value="date">Datum</option>
        <option value="title">Titel</option>
        <option value="venue">Locatie</option>
      </select>
      <button id="resetFilters" type="button">Filters resetten</button>
    </div>
  </div>
  <div id="list" class="list"></div>
</main>
<nav class="mobile-dock" aria-label="Mobiele bediening">
  <button id="mobileFilters" type="button"><span class="dock-icon">⌕</span><span>Filters</span></button>
  <button id="mobileTheme" type="button"><span class="dock-icon">◐</span><span>Skin</span></button>
  <button id="mobileTop" type="button"><span class="dock-icon">↑</span><span>Boven</span></button>
</nav>
<script>
let events=[];
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=s=>{const d=new Date(s+'T12:00:00');return new Intl.DateTimeFormat('nl-BE',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).format(d)};
const fmtUitDate=s=>{const d=new Date(s+'T12:00:00');return new Intl.DateTimeFormat('nl-BE',{weekday:'short',day:'numeric',month:'short'}).format(d).replace(/\.$/,'')};
const uitDateParts=s=>{const d=new Date(s+'T12:00:00');const weekday=new Intl.DateTimeFormat('nl-BE',{weekday:'short'}).format(d).replace(/\.$/,'').toLowerCase();const day=String(d.getDate());const month=new Intl.DateTimeFormat('nl-BE',{month:'short'}).format(d).replace(/\.$/,'').toLowerCase();return {weekday,day,month};};
const slug=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'default';
const normText=s=>String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim();
const titleStop=new Set(['a','an','and','de','een','en','het','of','the','van']);
function sameTitle(a,b){
 const left=normText(a), right=normText(b);
 if(!left||!right) return false;
 if(left===right) return true;
 const pair=[left,right].sort((x,y)=>x.length-y.length), shorter=pair[0], longer=pair[1];
 if(shorter.length>=12 && longer.includes(shorter)) return true;
 const lt=[...new Set(left.split(' ').filter(t=>t&&!titleStop.has(t)))];
 const rt=[...new Set(right.split(' ').filter(t=>t&&!titleStop.has(t)))];
 if(Math.min(lt.length,rt.length)<3) return false;
 const rs=new Set(rt); const common=lt.filter(t=>rs.has(t)).length;
 return common/Math.min(lt.length,rt.length)>=0.8;
}
function dedupeRows(rows){
 const kept=[];
 for(const row of rows){
   const idx=kept.findIndex(e=>
     e.Date===row.Date &&
     normText(e['Start Time'])===normText(row['Start Time']) &&
     normText(e.Venue)===normText(row.Venue) &&
     sameTitle(e.Title,row.Title)
   );
   if(idx<0){kept.push(row);continue;}
   const old=kept[idx];
   const quality=x=>[(x['Image URL']||'').length>0?1:0,(x.Description||'').length,(x.Title||'').length];
   const qa=quality(old), qb=quality(row);
   if(qb[0]>qa[0] || (qb[0]===qa[0] && (qb[1]>qa[1] || (qb[1]===qa[1] && qb[2]>qa[2])))) kept[idx]=row;
 }
 return kept;
}
const THEMES=['noir','arthouse','retro70','genre','uitbrugge','razorreel'];
const THEME_COLORS={noir:'#111318',arthouse:'#eee7d6',retro70:'#2a2119',genre:'#050506',uitbrugge:'#ffffff',razorreel:'#ffffff'};
function applyTheme(theme){
 const chosen=THEMES.includes(theme)?theme:'noir';
 document.body.dataset.theme=chosen;
 const tc=$('themeColor'); if(tc) tc.setAttribute('content',THEME_COLORS[chosen]||'#111318');
 if($('theme')) $('theme').value=chosen;
 const title=document.querySelector('.title h1');
 const subtitle=document.querySelector('.title p');
 if(chosen==='uitbrugge'){
   title.textContent='FILMAGENDA';
   subtitle.textContent='Filmvertoningen, specials, festivals en audiovisuele activiteiten in Brugge.';
 }else if(chosen==='razorreel'){
   title.textContent='RAZOR REEL';
   subtitle.textContent='FLANDERS FILM FEST · BRUGGE FILMAGENDA';
 }else if(chosen==='arthouse'){
   title.textContent='BRUGGE FILM AGENDA';
   subtitle.textContent='Een sobere, festivalachtige blik op film en audiovisuele events in Brugge.';
 }else{
   title.textContent='Brugge Film Tool';
   subtitle.textContent='Een cinematische bladerlaag boven UiTinVlaanderen voor Brugge — film, filmfestivals en aanverwante audiovisuele events in de komende 120 dagen.';
 }
 localStorage.setItem('bruggeFilmTheme',chosen);
 renderQuickFilters();
 render();
}
function filtered(){
 const q=$('search').value.trim().toLowerCase(), cat=$('category').value, venue=$('venue').value, p=$('period').value;
 const today=new Date(); today.setHours(0,0,0,0); let until=null; if(p!=='all'){until=new Date(today);until.setDate(until.getDate()+Number(p));}
 let rows=events.filter(e=>{
  const hay=[e.Title,e.Venue,e.Description,e.Category].join(' ').toLowerCase();
  const d=new Date(e.Date+'T12:00:00');
  return (!q||hay.includes(q))&&(!cat||e.Category===cat)&&(!venue||e.Venue===venue)&&(!until||d<=until);
 });
 rows=dedupeRows(rows);
 const sortBy=$('sort')?.value||'date';
 if(sortBy==='title') rows.sort((a,b)=>(a.Title||'').localeCompare(b.Title||'','nl'));
 else if(sortBy==='venue') rows.sort((a,b)=>(a.Venue||'').localeCompare(b.Venue||'','nl')||(a.Date||'').localeCompare(b.Date||''));
 else rows.sort((a,b)=>(a.Date||'').localeCompare(b.Date||'')||(a['Start Time']||'').localeCompare(b['Start Time']||'')||(a.Title||'').localeCompare(b.Title||'','nl'));
 return rows;
}
function render(){
 const rows=filtered();
 const categories=[...new Set(events.map(e=>e.Category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nl'));
 if($('resultsCount')) $('resultsCount').textContent=`${rows.length} ${rows.length===1?'resultaat':'resultaten'} gevonden`;
 $('stats').innerHTML='<div class="stat"><strong>'+rows.length+'</strong><span>zichtbaar</span></div>'+
   categories.map(c=>'<div class="stat"><strong>'+rows.filter(e=>e.Category===c).length+'</strong><span>'+esc(c)+'</span></div>').join('');
 if(!rows.length){$('list').innerHTML='<div class="empty">Geen resultaten voor deze filters.<small class="note">Probeer een ruimere periode of pas je filters aan.</small></div>';return;}
 $('list').innerHTML=rows.map(e=>{
   const catClass='badge-'+slug(e.Category);
   const initials=String(e.Title||'FILM').split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join('').toUpperCase();
   const imageUrl=String(e['Image URL']||'').trim();
   const imageHtml=imageUrl?`<img class="poster-image" src="${esc(imageUrl)}" alt="${esc('Afbeelding bij ' + (e.Title||'event'))}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.classList.remove('has-image');this.remove()">`:``;
   const shortDate=String(e.Date||'').split('-').slice(1).reverse().join('/');
   const uitDate=uitDateParts(e.Date);
   return `<article class="event">
    <div class="uit-poster ${imageUrl?'has-image':''}">${imageHtml}<span class="poster-badge">${esc(e.Category||'Film')}</span><div class="poster-mark">${esc(initials)}</div><div class="uit-date-banner" aria-label="${esc(fmtUitDate(e.Date))}"><span class="uit-date-weekday">${esc(uitDate.weekday)}</span><span class="uit-date-day">${esc(uitDate.day)}</span><span class="uit-date-month">${esc(uitDate.month)}</span><span class="uit-date-time">${esc(e['Start Time']||'uur onbekend')}</span></div></div>
    <div class="date-block"><div class="date">${esc(fmtDate(e.Date))}</div><div class="time">${esc(e['Start Time']||'uur onbekend')}</div></div>
    <div class="content"><div class="name">${esc(e.Title)}</div><div class="meta-row"><span class="badge ${catClass}">${esc(e.Category||'Onbekend')}</span></div></div>
    <div class="venue-wrap"><div class="venue">${esc(e.Venue||'Locatie onbekend')}</div></div>
    <div class="desc-wrap"><div class="desc">${esc(e.Description||'Geen beschrijving beschikbaar.')}</div></div>
    <div class="open-wrap"><a class="open-link" href="${esc(e['UiT Event Link'])}" target="_blank" rel="noopener">Bekijk details</a><span class="date-pill">${esc(shortDate)}</span></div>
   </article>`;
 }).join('');
}
function renderQuickFilters(){
 const holder=$('quickFilters');
 if(!holder) return;
 const categories=[...new Set(events.map(e=>e.Category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nl'));
 const active=$('category')?.value||'';
 holder.innerHTML=['',...categories].map(c=>`<button type="button" class="filter-chip ${active===c?'active':''}" data-cat="${esc(c)}">${c?esc(c):'Alles'}</button>`).join('');
 holder.querySelectorAll('.filter-chip').forEach(btn=>btn.addEventListener('click',()=>{
   $('category').value=btn.dataset.cat||'';
   renderQuickFilters();
   render();
 }));
}
function resetFilters(){
 $('search').value=''; $('category').value=''; $('venue').value=''; $('period').value='all';
 if($('sort')) $('sort').value='date';
 renderQuickFilters(); render();
}

function populateFilters(){
 const curVenue=$('venue').value, curCategory=$('category').value;
 const venues=[...new Set(events.map(e=>e.Venue).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nl'));
 const categories=[...new Set(events.map(e=>e.Category).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'nl'));
 $('venue').innerHTML='<option value="">Alle locaties</option>'+venues.map(v=>`<option>${esc(v)}</option>`).join('');
 $('category').innerHTML='<option value="">Alle categorieën</option>'+categories.map(c=>`<option>${esc(c)}</option>`).join('');
 $('venue').value=curVenue;$('category').value=curCategory;
 renderQuickFilters();
}
async function load(){
 const r=await fetch('/api/events',{cache:'no-store'});
 const data=await r.json();
 events=data.events||[];
 populateFilters();
 render();
 $('status').textContent=data.summary.csv_exists?`Laatste CSV-update: ${new Date(data.summary.updated_at).toLocaleString('nl-BE')} · ${data.summary.total} events in bestand · ${data.summary.image_count||0} beelden`:'Nog geen gegevensbestand gevonden. De agenda wordt lokaal of automatisch bijgewerkt.';
}
async function refresh(){
 const b=$('refresh');b.disabled=true;b.textContent='Bezig met ophalen…';$('status').textContent='UiTinVlaanderen wordt opnieuw bevraagd…';
 try{
   const r=await fetch('/api/refresh',{method:'POST'});
   const data=await r.json();
   if(!r.ok||!data.ok)throw new Error(data.error||'Onbekende fout');
   events=data.events||[];
   populateFilters();
   render();
   $('status').textContent=`Net ververst · ${data.summary.total} events gevonden · ${data.summary.image_count||0} beelden`;
 }catch(e){
   $('status').textContent='Verversen mislukt: '+e.message;
 }finally{
   b.disabled=false;b.textContent='UiT verversen';
 }
}

function openMobileFilters(){document.body.classList.add('mobile-filters-open');setTimeout(()=>$('search')?.focus(),120)}
function closeMobileFilters(){document.body.classList.remove('mobile-filters-open');$('search')?.blur()}
function cycleMobileTheme(){
 const current=document.body.dataset.theme||'noir';
 const next=THEMES[(THEMES.indexOf(current)+1)%THEMES.length];
 applyTheme(next);
}
$('mobileFilters').addEventListener('click',openMobileFilters);
$('closeFilters').addEventListener('click',closeMobileFilters);
$('mobileTheme').addEventListener('click',cycleMobileTheme);
$('mobileTop').addEventListener('click',()=>window.scrollTo({top:0,behavior:'smooth'}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMobileFilters()});
document.addEventListener('click',e=>{
 if(document.body.classList.contains('mobile-filters-open') && !e.target.closest('#filtersPanel') && !e.target.closest('#mobileFilters')) closeMobileFilters();
});

['search','venue','period'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));
$('category').addEventListener('change',()=>{renderQuickFilters();render();});
$('sort').addEventListener('change',render);
$('resetFilters').addEventListener('click',()=>{resetFilters();closeMobileFilters();});

$('theme').addEventListener('change',e=>applyTheme(e.target.value));
applyTheme(localStorage.getItem('bruggeFilmTheme')||'noir');
load();
</script>
</body>
</html>
